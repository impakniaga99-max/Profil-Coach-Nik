    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nik Mohd Nor Arif — Executive Resume &amp; Portfolio</title>
    <meta name="description" content="Multilingual executive resume and consultancy portfolio of Nik Mohd Nor Arif Bin Yahya, Manager and Principal Consultant." />
    <meta property="og:title" content="Nik Mohd Nor Arif — Executive Resume &amp; Portfolio" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('resume-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = stored === 'dark' || ((!stored || stored === 'system') && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F8F8F6] text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-blue-900 selection:text-white dark:selection:bg-blue-500 dark:selection:text-slate-950 transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
